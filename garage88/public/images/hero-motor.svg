<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050813"/>
      <stop offset=".55" stop-color="#0d1a3a"/>
      <stop offset="1" stop-color="#1b3f7a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".62" r=".6">
      <stop offset="0" stop-color="#1e90ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1e90ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1220"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfe3ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#bfe3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f3ff"/>
      <stop offset=".5" stop-color="#6fb4ff"/>
      <stop offset="1" stop-color="#16315c"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2aa0ff"/>
      <stop offset=".5" stop-color="#0b4fa8"/>
      <stop offset="1" stop-color="#06122b"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- langit -->
  <rect width="1200" height="1400" fill="url(#sky)"/>
  <rect width="1200" height="1400" fill="url(#glow)"/>
  <g fill="#cfe6ff" opacity=".75">
    <circle cx="140" cy="120" r="2"/><circle cx="330" cy="210" r="1.6"/><circle cx="520" cy="90" r="2.2"/>
    <circle cx="760" cy="170" r="1.8"/><circle cx="960" cy="110" r="2"/><circle cx="1090" cy="260" r="1.6"/>
    <circle cx="230" cy="330" r="1.4"/><circle cx="880" cy="340" r="1.6"/><circle cx="620" cy="300" r="1.2"/>
  </g>

  <!-- pegunungan -->
  <path d="M0 800 L160 690 L300 770 L470 640 L640 760 L820 660 L990 770 L1200 680 L1200 1400 L0 1400 Z" fill="#0a1530"/>
  <path d="M0 880 L200 800 L380 870 L560 780 L760 870 L960 790 L1200 880 L1200 1400 L0 1400 Z" fill="#070d20"/>

  <!-- jalan -->
  <path d="M0 1010 L1200 1010 L1200 1400 L0 1400 Z" fill="url(#road)"/>
  <rect x="0" y="1010" width="1200" height="3" fill="#2a6fd0" opacity=".6"/>
  <g fill="#cfe6ff" opacity=".35">
    <path d="M130 1400 L190 1400 L330 1110 L318 1110 Z"/>
    <path d="M1010 1400 L1070 1400 L930 1110 L918 1110 Z"/>
  </g>

  <!-- berkas lampu depan -->
  <path d="M800 760 L1200 640 L1200 1010 L800 800 Z" fill="url(#beam)"/>

  <!-- bayangan & pantulan di jalan -->
  <ellipse cx="600" cy="1050" rx="400" ry="26" fill="#000" opacity=".7" filter="url(#blur)"/>
  <ellipse cx="720" cy="1060" rx="320" ry="14" fill="#1e90ff" opacity=".35" filter="url(#blur)"/>

  <!-- ===== MOTOR ===== -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- knalpot -->
    <path d="M570 948 C480 1000 370 995 285 962" fill="none" stroke="#04070f" stroke-width="30"/>
    <path d="M570 944 C480 994 370 989 285 957" fill="none" stroke="url(#chrome)" stroke-width="12"/>

    <!-- roda belakang -->
    <circle cx="390" cy="920" r="122" fill="none" stroke="#04070f" stroke-width="28"/>
    <circle cx="390" cy="920" r="96" fill="none" stroke="#1e90ff" stroke-width="4" opacity=".85"/>
    <circle cx="390" cy="920" r="76" fill="none" stroke="#3a4a6a" stroke-width="2" opacity=".7"/>
    <g stroke="#3a4a6a" stroke-width="2" opacity=".7">
      <line x1="390" y1="844" x2="390" y2="996"/><line x1="314" y1="920" x2="466" y2="920"/>
      <line x1="336" y1="866" x2="444" y2="974"/><line x1="444" y1="866" x2="336" y2="974"/>
    </g>
    <circle cx="390" cy="920" r="18" fill="#0a0f1c" stroke="#6fb4ff" stroke-width="3"/>

    <!-- roda depan -->
    <circle cx="810" cy="920" r="122" fill="none" stroke="#04070f" stroke-width="28"/>
    <circle cx="810" cy="920" r="96" fill="none" stroke="#1e90ff" stroke-width="4" opacity=".85"/>
    <circle cx="810" cy="920" r="76" fill="none" stroke="#3a4a6a" stroke-width="2" opacity=".7"/>
    <g stroke="#3a4a6a" stroke-width="2" opacity=".7">
      <line x1="810" y1="844" x2="810" y2="996"/><line x1="734" y1="920" x2="886" y2="920"/>
      <line x1="756" y1="866" x2="864" y2="974"/><line x1="864" y1="866" x2="756" y2="974"/>
    </g>
    <circle cx="810" cy="920" r="18" fill="#0a0f1c" stroke="#6fb4ff" stroke-width="3"/>

    <!-- swingarm & rangka -->
    <path d="M390 920 L520 878" stroke="#04070f" stroke-width="18" fill="none"/>
    <path d="M520 878 L560 800 L700 770" stroke="#04070f" stroke-width="14" fill="none"/>

    <!-- mesin -->
    <rect x="490" y="826" width="170" height="130" rx="20" fill="#0a0f1c" stroke="#1e90ff" stroke-width="2" opacity=".95"/>
    <g stroke="#2a6fd0" stroke-width="3" opacity=".7">
      <line x1="505" y1="848" x2="645" y2="848"/><line x1="505" y1="868" x2="645" y2="868"/>
      <line x1="505" y1="888" x2="645" y2="888"/><line x1="505" y1="908" x2="645" y2="908"/>
    </g>
    <circle cx="590" cy="935" r="16" fill="#101a33" stroke="#6fb4ff" stroke-width="3"/>

    <!-- fork depan -->
    <line x1="738" y1="722" x2="810" y2="920" stroke="#04070f" stroke-width="20"/>
    <line x1="738" y1="722" x2="810" y2="920" stroke="url(#chrome)" stroke-width="6"/>
    <path d="M742 842 C792 806 862 812 884 856" fill="none" stroke="#0b4fa8" stroke-width="12"/>

    <!-- tangki + jok -->
    <path d="M330 800 C378 764 470 768 520 772 L560 758 C602 722 692 716 736 752 L742 792 C694 814 604 818 544 824 L420 834 C368 836 338 822 330 800 Z" fill="url(#tank)" stroke="#6fb4ff" stroke-width="2"/>
    <path d="M572 768 C610 744 684 740 722 764" fill="none" stroke="#e8f3ff" stroke-width="5" opacity=".8"/>
    <path d="M338 796 C380 776 470 778 515 782" fill="none" stroke="#04070f" stroke-width="16"/>

    <!-- stang -->
    <path d="M700 706 L748 690 L782 702" fill="none" stroke="#04070f" stroke-width="12"/>
    <path d="M700 706 L748 690 L782 702" fill="none" stroke="url(#chrome)" stroke-width="4"/>

    <!-- lampu depan -->
    <ellipse cx="772" cy="748" rx="30" ry="36" fill="#0a0f1c" stroke="#6fb4ff" stroke-width="3"/>
    <ellipse cx="780" cy="748" rx="18" ry="24" fill="#e8f6ff"/>
    <ellipse cx="780" cy="748" rx="60" ry="60" fill="#bfe3ff" opacity=".35" filter="url(#soft)"/>
  </g>

  <!-- vinyet gelap di tepi agar teks mudah dibaca -->
  <rect width="1200" height="1400" fill="#050813" opacity=".18"/>
</svg>
